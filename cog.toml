tag_prefix = "v"
branch = "main"
repository = "iri-namespace"
owner = "legra-ai"
ignore_merge_commits = true
from_latest_tag = true

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "iri-namespace"
owner = "legra-ai"
authors = [{ username = "jgeluk", signature = "Jacobus Geluk" }]

[commit_types]
feat = { title = "Features" }
fix = { title = "Bug Fixes" }
refactor = { title = "Refactoring" }
docs = { title = "Documentation" }
test = { title = "Tests" }
chore = { title = "Maintenance" }
