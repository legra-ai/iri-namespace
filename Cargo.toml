[package]
name = "iri-namespace"
version = "0.1.7"
description = "Validated namespace, prefix, and CURIE types for RDF and related syntaxes"
authors = ["DataRoad Inc, Delaware, USA, trading as Legra"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/legra-ai/iri-namespace"
keywords = ["iri", "namespace", "prefix", "curie", "rdf"]
categories = ["data-structures", "parser-implementations"]
publish = true
build = "build.rs"
include = ["src/**", "tests/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
doctest = true

[dependencies]
borrow-or-share = "0.2"
iri-rfc3987 = "0.1.2"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
rhusky = "2.0.1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
